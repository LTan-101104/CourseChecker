spring:
  application:
    name: server

  # ── Datasource ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/coursechecker_db
    username: coursechecker
    password: coursechecker
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
