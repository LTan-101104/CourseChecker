spring:
  application:
    name: server

  # ── Datasource ──────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5433/coursechecker_db
    username: coursechecker
    password: coursechecker
    driver-class-name: org.postgresql.Driver

  # ── JPA / Hibernate ────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  # ── Flyway ─────────────────────────────────────────────────
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  jwt:
    secret: ${APP_JWT_SECRET:coursechecker-local-dev-jwt-secret-coursechecker-local-dev-jwt-secret}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:30}
  admin:
    secret: ${APP_ADMIN_SECRET:coursechecker-local-admin-secret}
  imports:
    max-pdf-size-bytes: ${APP_IMPORTS_MAX_PDF_SIZE_BYTES:15728640}
    request-timeout-seconds: ${APP_IMPORTS_REQUEST_TIMEOUT_SECONDS:20}
    async:
      core-pool-size: ${APP_IMPORTS_ASYNC_CORE_POOL_SIZE:2}
      max-pool-size: ${APP_IMPORTS_ASYNC_MAX_POOL_SIZE:4}
      queue-capacity: ${APP_IMPORTS_ASYNC_QUEUE_CAPACITY:50}
      thread-name-prefix: ${APP_IMPORTS_ASYNC_THREAD_NAME_PREFIX:import-worker-}
