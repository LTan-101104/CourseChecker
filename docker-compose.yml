services:
  postgres:
    image: postgres:17-alpine
    container_name: coursechecker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: coursechecker
      POSTGRES_PASSWORD: coursechecker
      POSTGRES_DB: coursechecker_db
    ports:
      - "5433:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coursechecker -d coursechecker_db"]
      interval: 10s
      timeout: 5s
      retries: 5
